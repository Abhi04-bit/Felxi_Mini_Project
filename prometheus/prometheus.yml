global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /tmp/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: sentinelpulse-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - exporter:9108

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  - job_name: blackbox-https
    metrics_path: /probe
    scrape_interval: 1m
    scrape_timeout: 15s
    params:
      module: [https_cert_expiry]
    file_sd_configs:
      - files:
          - /etc/prometheus/blackbox-targets.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
